<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phoenix FileShare</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0d1117;
    color: #e6edf3;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    min-height: 100vh;
    padding-bottom: 60px;
  }
  header {
    background: #161b22;
    border-bottom: 1px solid #30363d;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header h1 {
    font-size: 18px;
    font-weight: 600;
    color: #e85d04;
    letter-spacing: 0.5px;
  }
  #refresh-btn {
    background: none;
    border: 1px solid #30363d;
    color: #e6edf3;
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
  }
  #refresh-btn:hover { border-color: #e85d04; color: #e85d04; }

  .tabs { display: flex; border-bottom: 1px solid #30363d; }
  .tab {
    flex: 1;
    padding: 12px;
    text-align: center;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    color: #8b949e;
    border-bottom: 2px solid transparent;
    transition: all 0.2s;
  }
  .tab.active { color: #e85d04; border-bottom-color: #e85d04; }

  .tab-content { display: none; padding: 16px; }
  .tab-content.active { display: block; }

  .upload-zone {
    border: 2px dashed #30363d;
    border-radius: 10px;
    padding: 36px 20px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s;
    margin-bottom: 16px;
  }
  .upload-zone:hover, .upload-zone.drag-over { border-color: #e85d04; }
  .upload-zone p { color: #8b949e; font-size: 14px; }
  .upload-zone .hint { font-size: 12px; margin-top: 6px; }
  input[type="file"] { display: none; }

  .preview {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 12px;
    font-size: 13px;
    display: none;
  }
  .preview .fname { font-weight: 600; color: #e85d04; }
  .preview .fsize { color: #8b949e; margin-left: 8px; }

  #send-btn {
    width: 100%;
    background: #e85d04;
    color: #fff;
    border: none;
    padding: 12px;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    display: none;
  }
  #send-btn:hover { background: #f26a10; }
  #send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .progress-bar {
    height: 4px;
    background: #30363d;
    border-radius: 2px;
    margin-top: 10px;
    display: none;
  }
  .progress-bar .fill {
    height: 100%;
    background: #e85d04;
    border-radius: 2px;
    width: 0%;
    transition: width 0.1s;
  }

  .file-card {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 10px;
  }
  .file-card .top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
  }
  .file-card .fname {
    font-size: 14px;
    font-weight: 600;
    word-break: break-all;
    flex: 1;
  }
  .file-card .del-btn {
    background: none;
    border: none;
    color: #f85149;
    font-size: 12px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .file-card .del-btn:hover { text-decoration: underline; }
  .file-card .meta { font-size: 12px; color: #8b949e; margin-top: 4px; }
  .file-card .note { font-size: 12px; color: #c9d1d9; margin-top: 4px; font-style: italic; }
  .file-card .by { color: #e85d04; }
  .download-btn {
    width: 100%;
    background: #238636;
    color: #fff;
    border: none;
    padding: 8px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    margin-top: 8px;
    display: block;
    text-align: center;
    text-decoration: none;
  }
  .download-btn:hover { background: #2ea043; }

  .empty {
    text-align: center;
    color: #484f58;
    font-size: 14px;
    padding: 40px 0;
    line-height: 1.8;
  }

  footer {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: #161b22;
    border-top: 1px solid #30363d;
    text-align: center;
    font-size: 11px;
    color: #484f58;
    padding: 8px;
  }
</style>
</head>
<body>

<header>
  <h1>🔥 Phoenix FileShare</h1>
  <button id="refresh-btn" onclick="loadFiles()">↻ Refresh</button>
</header>

<div class="tabs">
  <div class="tab active" onclick="switchTab('outbox')">Outbox</div>
  <div class="tab" onclick="switchTab('inbox')">Inbox</div>
</div>

<div id="outbox-tab" class="tab-content active">
  <div id="outbox-list"></div>
</div>

<div id="inbox-tab" class="tab-content">
  <div class="upload-zone" id="upload-zone" onclick="document.getElementById('file-input').click()">
    <p>📤 Tap to upload a file</p>
    <p class="hint">Any file type</p>
  </div>
  <input type="file" id="file-input" />
  <div class="preview" id="preview">
    <span class="fname" id="preview-name"></span>
    <span class="fsize" id="preview-size"></span>
  </div>
  <button id="send-btn" onclick="doUpload()">Send to Berlin</button>
  <div class="progress-bar" id="progress-bar"><div class="fill" id="progress-fill"></div></div>
  <div id="inbox-list" style="margin-top:16px"></div>
</div>

<footer id="footer">Last updated: —</footer>

<script>
const API = "http://100.71.89.61:9001/api";
let activeTab = "outbox";
let fileToUpload = null;
let lastLoad = 0;

loadFiles();

function switchTab(tab) {
  activeTab = tab;
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  document.querySelectorAll(".tab-content").forEach(c => c.classList.remove("active"));
  if (tab === "outbox") {
    document.querySelector(".tab").classList.add("active");
    document.getElementById("outbox-tab").classList.add("active");
  } else {
    document.querySelectorAll(".tab")[1].classList.add("active");
    document.getElementById("inbox-tab").classList.add("active");
  }
}

async function loadFiles() {
  try {
    const r = await fetch(API + "/files");
    const data = await r.json();
    renderFiles(data.files || []);
    lastLoad = Date.now();
    updateFooter();
  } catch(e) { console.error(e); }
}

function renderFiles(files) {
  const outList = document.getElementById("outbox-list");
  const inList = document.getElementById("inbox-list");
  outList.innerHTML = "";
  inList.innerHTML = "";

  const outFiles = files.filter(f => f.dir === "outbox");
  const inFiles = files.filter(f => f.dir === "inbox");

  if (outFiles.length === 0)
    outList.innerHTML = '<div class="empty">No files yet.<br>Agents will publish here.</div>';
  else
    outFiles.forEach(f => outList.appendChild(makeCard(f)));

  if (inFiles.length === 0)
    inList.innerHTML = '<div class="empty">Inbox is empty.</div>';
  else
    inFiles.forEach(f => inList.appendChild(makeCard(f)));
}

function makeCard(f) {
  const card = document.createElement("div");
  card.className = "file-card";
  const size = f.size < 1024*1024
    ? (f.size/1024).toFixed(1) + " KB"
    : (f.size/1024/1024).toFixed(1) + " MB";
  const date = f.uploaded_at ? new Date(f.uploaded_at).toLocaleString() : "";
  const downloadUrl = API + "/download/" + f.dir + "/" + encodeURIComponent(f.name);
  card.innerHTML =
    '<div class="top">' +
      '<div class="fname">' + esc(f.name) + '</div>' +
      '<button class="del-btn" onclick="doDelete(\'' + f.dir + '\',\'' + esc(f.name) + '\')">✕</button>' +
    '</div>' +
    '<div class="meta">' + size + ' · ' + date + ' · <span class="by">' + esc(f.uploaded_by) + '</span></div>' +
    (f.note ? '<div class="note">"' + esc(f.note) + '"</div>' : '') +
    '<a class="download-btn" href="' + downloadUrl + '" download="' + esc(f.name) + '">Download</a>';
  return card;
}

function esc(s) {
  return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

async function doDelete(dir, name) {
  if (!confirm("Delete " + name + "?")) return;
  const r = await fetch(API + "/files/" + dir + "/" + encodeURIComponent(name), {
    method: "DELETE"
  });
  if (r.ok) loadFiles();
}

function updateFooter() {
  const ago = Math.round((Date.now() - lastLoad) / 1000);
  document.getElementById("footer").textContent = "Last updated: " + ago + "s ago";
}

// Upload handling
const zone = document.getElementById("upload-zone");
const finput = document.getElementById("file-input");
const preview = document.getElementById("preview");
const previewName = document.getElementById("preview-name");
const previewSize = document.getElementById("preview-size");
const sendBtn = document.getElementById("send-btn");

finput.addEventListener("change", () => {
  if (finput.files.length) selectFile(finput.files[0]);
});

zone.addEventListener("dragover", e => { e.preventDefault(); zone.classList.add("drag-over"); });
zone.addEventListener("dragleave", () => zone.classList.remove("drag-over"));
zone.addEventListener("drop", e => {
  e.preventDefault();
  zone.classList.remove("drag-over");
  if (e.dataTransfer.files.length) selectFile(e.dataTransfer.files[0]);
});

function selectFile(f) {
  fileToUpload = f;
  previewName.textContent = f.name;
  previewSize.textContent = f.size < 1024*1024
    ? (f.size/1024).toFixed(1) + " KB"
    : (f.size/1024/1024).toFixed(1) + " MB";
  preview.style.display = "block";
  sendBtn.style.display = "block";
  sendBtn.disabled = false;
  sendBtn.textContent = "Send to Berlin";
}

function doUpload() {
  if (!fileToUpload) return;
  sendBtn.disabled = true;
  sendBtn.textContent = "Sending...";
  const bar = document.getElementById("progress-bar");
  const fill = document.getElementById("progress-fill");
  bar.style.display = "block";
  fill.style.width = "0%";

  const xhr = new XMLHttpRequest();
  xhr.open("POST", API + "/upload");
  xhr.upload.onprogress = e => {
    if (e.lengthComputable) fill.style.width = (e.loaded / e.total * 100) + "%";
  };
  xhr.onload = () => {
    bar.style.display = "none";
    if (xhr.status === 200 || xhr.status === 201) {
      fileToUpload = null;
      finput.value = "";
      preview.style.display = "none";
      sendBtn.style.display = "none";
      loadFiles();
    } else {
      sendBtn.disabled = false;
      sendBtn.textContent = "Failed — Retry";
      fill.style.width = "0%";
    }
  };
  const fd = new FormData();
  fd.append("file", fileToUpload);
  xhr.send(fd);
}

// Auto-refresh every 30s
setInterval(loadFiles, 30000);
setInterval(updateFooter, 1000);
</script>
</body>
</html>
