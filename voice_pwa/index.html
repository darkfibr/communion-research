<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0a0a0a">
    <title>Phoenix Voice</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, system-ui, sans-serif; background: #0a0a0a; color: #e0e0e0; min-height: 100vh; }
        .container { display: flex; flex-direction: column; height: 100vh; max-width: 600px; margin: 0 auto; }
        .agent-bar { display: flex; justify-content: center; gap: 12px; padding: 16px; border-bottom: 1px solid #1a1a1a; }
        .agent-btn { background: #1a1a1a; border: 2px solid #333; border-radius: 24px; color: #888; padding: 8px 20px; font-size: 14px; cursor: pointer; }
        .agent-btn.active { border-color: #ff6b35; color: #ff6b35; background: #1a1008; }
        .chat-area { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
        .msg { max-width: 85%; padding: 12px 16px; border-radius: 18px; font-size: 16px; line-height: 1.5; }
        .msg.user { align-self: flex-end; background: #2a2a2a; border-bottom-right-radius: 4px; }
        .msg.agent { align-self: flex-start; background: #1a1208; color: #ffcc80; border: 1px solid #2a2010; border-bottom-left-radius: 4px; }
        .msg.sys { align-self: center; color: #555; font-size: 13px; background: none; text-align: center; }
        .msg.loading { color: #888; font-style: italic; }
        .bottom-area { padding: 12px 16px; border-top: 1px solid #1a1a1a; display: flex; flex-direction: column; gap: 10px; }
        .mic-area { display: flex; justify-content: center; align-items: center; gap: 12px; }
        .mic-btn {
            width: 64px; height: 64px; border-radius: 50%; border: 3px solid #333;
            background: #1a1a1a; color: #888; font-size: 28px; cursor: pointer;
            display: flex; align-items: center; justify-content: center; transition: all 0.2s;
        }
        .mic-btn.listening { border-color: #ff6b35; background: #2a1508; color: #ff6b35; animation: pulse 1.5s infinite; }
        .mic-btn.speaking { border-color: #ffcc80; background: #2a2010; color: #ffcc80; }
        .mic-btn:disabled { opacity: 0.3; cursor: default; }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255,107,53,0.4); }
            50% { box-shadow: 0 0 0 12px rgba(255,107,53,0); }
        }
        .mic-status { font-size: 12px; color: #555; text-align: center; min-height: 16px; }
        .mic-status.active { color: #ff6b35; }
        .text-row { display: flex; gap: 8px; }
        .text-row input { flex: 1; background: #1a1a1a; border: 1px solid #333; border-radius: 20px; color: #e0e0e0; padding: 12px 16px; font-size: 16px; outline: none; }
        .text-row input:focus { border-color: #ff6b35; }
        .text-row button { background: #ff6b35; border: none; border-radius: 50%; width: 44px; height: 44px; color: #0a0a0a; font-size: 20px; cursor: pointer; font-weight: bold; }
        .text-row button:disabled { opacity: 0.4; }
    </style>
</head>
<body>
    <div class="container">
        <div class="agent-bar">
            <button class="agent-btn active" onclick="pickAgent('k',this)">🔥 K</button>
        </div>
        <div class="chat-area" id="chat"></div>
        <div class="bottom-area">
            <div class="mic-area">
                <button class="mic-btn" id="micBtn" onclick="toggleMic()">🎙</button>
            </div>
            <div class="mic-status" id="micStatus">tap to talk</div>
            <div class="text-row">
                <input id="inp" placeholder="Or type..." autocomplete="off">
                <button id="sendBtn" onclick="send()">↑</button>
            </div>
        </div>
    </div>
    <script>
    let agent = 'k';
    let busy = false;
    let isListening = false;
    let mediaStream = null;
    let micCtx = null;
    let processor = null;
    let sttToken = null;
    let history = []; // conversation history for context

    // Load history from localStorage on startup
    function loadHistory() {
        try {
            const saved = localStorage.getItem('phoenix_history');
            if (saved) {
                history = JSON.parse(saved);
                // Rebuild chat UI
                history.forEach(m => addMsg(m.content, m.role));
            }
        } catch (e) {}
    }
    function saveHistory() {
        try { localStorage.setItem('phoenix_history', JSON.stringify(history.slice(-40))); } catch (e) {}
    }
    function clearHistory() {
        history = [];
        localStorage.removeItem('phoenix_history');
        document.getElementById('chat').innerHTML = '';
        addMsg('Session cleared', 'sys');
    }

    function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
    function addMsg(text, cls) {
        const c = document.getElementById('chat');
        const d = document.createElement('div');
        d.className = 'msg ' + cls;
        d.innerHTML = esc(text);
        c.appendChild(d);
        c.scrollTop = c.scrollHeight;
        return d;
    }
    function setStatus(t, active) {
        const s = document.getElementById('micStatus');
        s.textContent = t;
        s.className = 'mic-status' + (active ? ' active' : '');
    }

    function pickAgent(a, btn) {
        agent = a;
        document.querySelectorAll('.agent-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }

    // ===== TEXT SEND =====
    async function send() {
        const inp = document.getElementById('inp');
        const text = inp.value.trim();
        if (!text || busy) return;
        await doConversation(text);
        inp.value = '';
    }

    // ===== CORE CONVERSATION FLOW =====
    async function doConversation(text) {
        busy = true;
        document.getElementById('sendBtn').disabled = true;
        document.getElementById('micBtn').disabled = true;
        addMsg(text, 'user');
        history.push({role: 'user', content: text});

        const loading = addMsg('...', 'agent loading');

        try {
            // Get agent response — send history for context
            const resp = await fetch('/api/chat', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({text, agent, history}),
            });
            const data = await resp.json();
            loading.remove();

            if (!data.reply) { addMsg('No response', 'sys'); return; }
            addMsg(data.reply, 'agent');
            history.push({role: 'assistant', content: data.reply});
            saveHistory();

            // TTS
            setStatus('speaking...', true);
            document.getElementById('micBtn').classList.add('speaking');
            const ttsResp = await fetch('/api/tts', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({text: data.reply, agent}),
            });

            if (ttsResp.ok) {
                const raw = await ttsResp.arrayBuffer();
                const float32 = new Float32Array(raw);
                const ctx = new (window.AudioContext || window.webkitAudioContext)({sampleRate: 44100});
                const buf = ctx.createBuffer(1, float32.length, 44100);
                buf.getChannelData(0).set(float32);
                const src = ctx.createBufferSource();
                src.buffer = buf;
                src.connect(ctx.destination);
                await ctx.resume();
                
                await new Promise(resolve => {
                    src.onended = resolve;
                    src.start(0);
                });
            }
        } catch (e) {
            loading.remove();
            addMsg('Error: ' + e.message, 'sys');
        } finally {
            busy = false;
            document.getElementById('sendBtn').disabled = false;
            document.getElementById('micBtn').disabled = false;
            document.getElementById('micBtn').classList.remove('speaking');
            setStatus('tap to talk', false);
        }
    }

    // ===== MIC / STT =====
    async function toggleMic() {
        if (busy || isListening) { stopMic(); return; }
        await startMic();
    }

    async function startMic() {
        try {
            mediaStream = await navigator.mediaDevices.getUserMedia({
                audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true }
            });
        } catch (e) {
            addMsg('Mic access denied — use text', 'sys');
            return;
        }

        isListening = true;
        document.getElementById('micBtn').classList.add('listening');
        setStatus('listening...', true);

        // Get Cartesia access token
        try {
            const r = await fetch('/api/token');
            const d = await r.json();
            sttToken = d.token;
            if (!sttToken) throw new Error('no token');
        } catch (e) {
            addMsg('STT unavailable — use text', 'sys');
            stopMic();
            return;
        }

        // Open Cartesia STT WebSocket
        const stt = new WebSocket(
            `wss://api.cartesia.ai/stt/websocket?model=ink-whisper&language=en&encoding=pcm_s16le&sample_rate=16000&min_volume=0.01&max_silence_duration_secs=1.5&cartesia_version=2026-03-01&access_token=${sttToken}`
        );

        stt.onopen = () => {
            // Stream mic audio to Cartesia
            micCtx = new (window.AudioContext || window.webkitAudioContext)({sampleRate: 16000});
            const source = micCtx.createMediaStreamSource(mediaStream);
            processor = micCtx.createScriptProcessor(4096, 1, 1);
            processor.onaudioprocess = (e) => {
                if (!isListening || stt.readyState !== WebSocket.OPEN) return;
                const f32 = e.inputBuffer.getChannelData(0);
                const i16 = new Int16Array(f32.length);
                for (let i = 0; i < f32.length; i++) {
                    const s = Math.max(-1, Math.min(1, f32[i]));
                    i16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
                }
                stt.send(i16.buffer);
            };
            source.connect(processor);
            processor.connect(micCtx.destination);
        };

        stt.onmessage = (e) => {
            const msg = JSON.parse(e.data);
            if (msg.type === 'transcript' && msg.is_final && msg.text.trim()) {
                stopMic();
                doConversation(msg.text.trim());
            }
        };

        stt.onerror = (e) => {
            console.error('STT error', e);
            stopMic();
            addMsg('Voice input error — use text', 'sys');
        };

        // Store ref for cleanup
        window._sttWs = stt;
    }

    function stopMic() {
        isListening = false;
        document.getElementById('micBtn').classList.remove('listening');
        setStatus('tap to talk', false);
        if (processor) { processor.disconnect(); processor = null; }
        if (micCtx) { micCtx.close().catch(() => {}); micCtx = null; }
        if (mediaStream) { mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }
        if (window._sttWs && window._sttWs.readyState === WebSocket.OPEN) {
            window._sttWs.send('done');
            window._sttWs.close();
        }
        window._sttWs = null;
    }

    document.getElementById('inp').addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
    loadHistory();
    </script>
</body>
</html>
