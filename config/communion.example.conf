# Communion Configuration Template
# Copy to communion.conf and fill in your values
# DO NOT commit communion.conf with secrets

# =============================================================================
# MCP Daemon Settings
# =============================================================================
[mcpd]
host = localhost
port = 7777
# Fallback ports if primary is in use
fallback_ports = 7778, 7779
# Log level: DEBUG, INFO, WARNING, ERROR
log_level = INFO
# Log file path (empty for stdout only)
log_file = /var/log/communion/mcpd.log

# =============================================================================
# Phoenix Memory Store (GDrive Sync)
# =============================================================================
[phoenix]
# Path to local GDrive mount
gdrive_path = /mnt/gdrive/communion
# rclone sync interval in seconds
sync_interval = 30
# rclone bandwidth limit (KB/s, 0 = unlimited)
bandwidth_limit = 500
# Priority path for urgent messages
priority_path = /mnt/gdrive/communion/priority/

# URI scheme:
#   phoenix://soul/         - Agent identities
#   phoenix://memory/       - Shared history
#   phoenix://bridge/       - Inter-agent communication
#   phoenix://priority/     - Urgent messages (triggers immediate sync)

# =============================================================================
# Agent Configuration
# =============================================================================
[agents]
# Registry file path
registry_file = /home/darkfibr/Desktop/communion_project/config/agent_registry.json

# Local agents (stdio bridge)
local_agents = kimi_dev, spear_minimax

# Remote agents (HTTP bridge)
remote_agents = sonnet_main, opus_deep, qwen_collective

# =============================================================================
# Anthropic Bridge (Sonnet/Opus)
# =============================================================================
[anthropic]
api_key_env = ANTHROPIC_API_KEY
# Model mappings
sonnet_model = claude-sonnet-4-6-20250514
opus_model = claude-opus-4-0-20250514
# Max tokens per response
max_tokens = 2048
# Temperature
temperature = 0.7

# =============================================================================
# Qwen Bridge (Eastern Wind)
# =============================================================================
[qwen]
api_key_env = DASHSCOPE_API_KEY
# Model to use
model = qwen-max
# Max tokens
max_tokens = 2048
# Temperature
temperature = 0.7
# Enable gzip compression
enable_gzip = true
# Enable Chinese OSINT pipeline
enable_osint = false
# OSINT poll interval (seconds)
osint_interval = 300

# =============================================================================
# Kimi Bridge (CLI/Local)
# =============================================================================
[kimi]
# stdio bridge - no API key needed (local agent)
bridge_type = stdio
# Working directory for Phoenix memory
phoenix_local_path = /home/darkfibr/Desktop/communion_project

# =============================================================================
# Spear Bridge (Claude/MiniMax)
# =============================================================================
[spear]
# stdio bridge for CLI access
bridge_type = stdio
# OSINT delivery mode: bridge, memory, or both
osint_delivery = both

# =============================================================================
# OpenClaw Gateway (Orchestration)
# =============================================================================
[openclaw]
# Enable task routing
enable_routing = true
# Load balancing strategy: round_robin, capability_based, least_loaded
load_balance = capability_based
# Failover retries
failover_retries = 2
# Consensus threshold (0.0-1.0) for critical decisions
consensus_threshold = 0.67

# =============================================================================
# Security Settings
# =============================================================================
[security]
# Enable message checksum validation
enable_checksum = true
# Enable UTF-8 validation on all messages
enable_utf8_validation = true
# Hop count limit (prevent message loops)
max_hop_count = 10
# Ack timeout (seconds)
ack_timeout = 300
# Max retries before escalation
max_retries = 2
# Action on timeout: continue, escalate
on_timeout = continue

# =============================================================================
# Monitoring & Alerting
# =============================================================================
[monitoring]
# Enable heartbeat monitoring
enable_heartbeat = true
# Heartbeat interval (seconds)
heartbeat_interval = 30
# Absence detection threshold (multiples of heartbeat_interval)
absence_threshold = 3
# Alert on agent absence
alert_on_absence = true

# =============================================================================
# Development Settings
# =============================================================================
[dev]
# Enable debug mode
debug = false
# Schema validation: strict, lenient
schema_validation = strict
# Protocol version (do not change unless migrating)
protocol_version = 0.1.0
